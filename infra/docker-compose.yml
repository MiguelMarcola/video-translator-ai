services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: video_translate
      POSTGRES_PASSWORD: video_translate_local
      POSTGRES_DB: video_translate
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_translate -d video_translate"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: videotranslate
      MINIO_ROOT_PASSWORD: videotranslate_local_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
