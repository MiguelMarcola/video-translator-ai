name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: Testes Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @video-translate/contracts build
      - run: pnpm --filter @video-translate/contracts test
      - run: pnpm --filter @video-translate/web test

  python:
    name: Testes de midia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest==8.4.2 yt-dlp==2026.10.26
      - run: PYTHONPATH=workers/media-python python -m pytest workers/media-python/tests -q
